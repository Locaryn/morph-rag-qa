[package]
name = "locaryn-plugin-rag-qa"
version = "1.1.0"
edition = "2021"
description = "Official Locaryn Extension: Document RAG, PDF Indexing & Semantic Question-Answering"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "locaryn-rag-qa-mcp"
path = "src/bin/rag_qa_mcp.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[workspace]
